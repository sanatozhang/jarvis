# graygate/metrics.yaml — 11 项 Native 看板 (mbn-8h9-m2p) 指标映射
# 移植自 ~/.claude/skills/weekly-report-core-metrics-sync/native-mapping.yaml，
# 补 Android ANR / Refresh Rate（该文件没有，2026-08-19 现场核对 widget 标题新增）。
# 2026-10-20：看板 widget 标题整体英文化，FPS / Jank / 首页 / 详情页 4 组标题同步改成英文
# （旧中文标题已不存在 → 日报「取数失败」）。对应关系按 metric/formula/target 核对过，
# 与 weekly-report-core-metrics-sync/native-mapping.yaml 一致。
#
# version 不写死在这里 —— 由调用方（version_resolver 产出的每平台主力 build，
# 或 config.version_pattern 的大盘通配符）作为 template_variables 在查询时动态传入。
#
# widget 类型（RUM search.query 或 metrics tag-list）由 dashboard JSON 自身携带，
# dashboard_query.py 的 strip_template_vars 会自动识别处理，metrics.yaml 不需要区分。

defaults:
  dashboard_id: mbn-8h9-m2p
  template_variables:
    env: production
    os_version: "*"
    usr.id: "*"

metrics:
  - key: crash_free
    title: "Crash-free sessions"
    cell_format: "{v:.2f}%"
    # 2026-10-21：按团队 APM 指标体系改成分平台三档（🟩 Healthy / 🟨 Warning / 🟥 Critical），
    # 原单一阈值 ≥99.97（照抄 native-mapping.yaml SOTA）过严，99.94% 也标红。
    target_by_platform:
      ios:     { op: ">=", green: 99.95, yellow: 99.90 }
      android: { op: ">=", green: 99.90, yellow: 99.80 }

  - key: android_anr
    title: "Android ANR"
    cell_format: "{v:.2f}%"
    not_applicable_platform: ios     # iOS 查询会返回 0.0000（非缺数据），但 ANR 概念不适用 iOS —— 报告显示 "—（不适用）"
    # 2026-10-21：看板 "Android ANR" widget 公式改为「用户感知」近似口径：
    #   cardinality(@usr.id | ANR 且 -@view.name:Background) / cardinality(@usr.id | session) × 100
    # 即「前台发生过 ANR 的用户 / 活跃用户」（原来是 rum.measure.error.anr 事件数 / 会话数，含后台 ANR）。
    # 日报窗口=1 天 → 接近 Google Play User-Perceived ANR Rate（按 DAU），套 APM 体系三档。
    # 注意 Datadog 是 SDK 看门狗（主线程阻塞 ≥5s）检测 + RUM 采样，与 Play Console 数值不会完全一致。
    target: { op: "<=", green: 0.10, yellow: 0.30 }

  - key: hang_rate
    # 2026-10-21 晚：看板 widget 改名 + 改口径 ——
    #   旧「Hang Rate (iOS only)」= 每小时累计 hang 时长（ns/h，scale 换算成 ms/hr）
    #   新「Hang Rate (iOS only, % sessions with ≥2s hang)」=
    #     cardinality(@session.id | App Hang ≥2s 且 -@view.name:Background) / sessions × 100
    # 旧标题既不精确匹配也不是新标题前缀（"only)" vs "only,"）→ 半小时报「取数失败」。
    # 写完整标题而非前缀：card_builder 取 directionality 只认精确标题，前缀匹配会让恶化判定静默失效。
    title: "Hang Rate (iOS only, % sessions with ≥2s hang)"
    cell_format: "{v:.2f}%"
    not_applicable_platform: android # Android 无 app hang 指标，对应概念是上面的 android_anr
    target: { op: "<=", green: 0.10, yellow: 0.30 }   # 与看板 conditional_format 一致

  - key: refresh_rate
    title: "Refresh Rate"
    cell_format: "{v:.2f}"
    target: { op: ">=", value: 59 }   # 无官方 SOTA 来源，按 60Hz 屏幕近满帧粗定，供参考用色点

  - key: fps
    title: "APP Runtime FPS (P10)"   # 2026-10-21 晚：看板改为 pc10(@context.avg_fps)，原为均值
    cell_format: "{v:.2f}"
    target: { op: ">=", value: 50 }   # 与看板 conditional_format 一致

  - key: jank
    # 双 widget 合一行；formula 各自独立查询，渲染时拼成一个 cell
    title_p75: "App Jank Count per Session (p75)"
    title_p90: "App Jank Count per Session (p90)"
    cell_format: "{p75:.1f}/{p90:.1f}"
    target_p75: { op: "<=", value: 20 }
    target_p90: { op: "<=", value: 40 }

  - key: cold_startup_p90
    title: "Cold Startup p90"
    scale: 0.001    # raw ms → s（照抄 native-mapping.yaml；final review 指出本次实施漏抄，2026-08-19 补上）
    cell_format: "{v:.2f}s"
    target: { op: "<=", value: 1.5 }

  - key: memory_usage
    title: "Memory Usage"
    scale: 9.5367431640625e-7   # raw → MiB（实测 iOS 129,931,081 raw → 123.9 MiB，Android 350,468,947 raw → 334.2 MiB，量级核对通过）
    cell_format: "{v:.2f}MiB"
    target: { op: "<=", value: 400 }

  - key: home_render
    title_p75: "Home File List Load Time P75"
    title_p90: "Home File List Load Time P90"
    cell_format: "{p75:.2f}ms / {p90:.2f}ms"
    target_p75: { op: "<=", value: 200 }
    target_p90: { op: "<=", value: 200 }

  - key: detail_render_p90
    # 2026-10-21 晚：看板删除 P90 widget，只剩 P75；key 保留 detail_render_p90 不动（历史/展示映射引用它）
    title: "Detail Page First Screen End-to-End Load Time P75"
    cell_format: "{v:.2f}ms"
    target: { op: "<=", green: 1000, yellow: 2000 }   # 与看板 conditional_format 一致

  - key: summary_render_p90
    # 2026-10-21 晚：看板删除 P90 widget，只剩 P75；key 保留 summary_render_p90 不动
    title: "Detail Page WebView Ready Time P75"   # @total_load_ms
    cell_format: "{v:.2f}ms"
    target: { op: "<=", value: 500 }
